name: Automatic maintenance
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ai_improvements:
        description: Attempt one small Gemini improvement if GEMINI_API_KEY is configured
        type: boolean
        default: true
      apply:
        description: Publish verified changes to main (false runs a dry run)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: substition-maintenance
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.MAINTENANCE_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Save trusted guard outside the editable workspace
        run: cp scripts/maintenance-policy.mjs "$RUNNER_TEMP/maintenance-policy.mjs"
      - run: pnpm install --frozen-lockfile
      - name: Refresh compatible direct and transitive dependencies
        run: pnpm update --depth 100
      - name: Determine optional AI availability
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_REQUESTED: ${{ inputs.ai_improvements }}
        run: |
          enabled=false
          if [ -n "$GEMINI_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$AI_REQUESTED" = true ]; then
              enabled=true
            elif [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 7 ]; then
              enabled=true
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = false ]; then
            echo "AI skipped: requires GEMINI_API_KEY plus a Sunday schedule or enabled manual run. Dependency maintenance continues." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Propose one bounded improvement with Gemini
        if: steps.ai.outputs.enabled == 'true'
        timeout-minutes: 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gemini-maintenance.mjs
      - name: Apply deterministic formatting
        run: pnpm format
      - name: Capture and enforce the change policy
        id: candidate
        run: node "$RUNNER_TEMP/maintenance-policy.mjs" capture "$RUNNER_TEMP/candidate.json" "$GITHUB_SHA"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Reject known moderate, high and critical advisories
        run: pnpm audit --audit-level moderate
      - run: pnpm build
      - run: pnpm smoke
      - name: Verify the tested files are unchanged
        run: node "$RUNNER_TEMP/maintenance-policy.mjs" unchanged "$RUNNER_TEMP/candidate.json" "$GITHUB_SHA"
      - name: Save exact tested candidate
        if: steps.candidate.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-maintenance
          path: ${{ runner.temp }}/candidate.json
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && vars.MAINTENANCE_PAUSED != 'true' && (github.event_name == 'schedule' || inputs.apply)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/verified-maintenance
          merge-multiple: true
      - name: Revalidate with the trusted main-branch guard
        run: node scripts/maintenance-policy.mjs apply "$RUNNER_TEMP/verified-maintenance/candidate.json" "$GITHUB_SHA"
      - name: Fast-forward main only when its tested base is current
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced; refusing to publish an untested combination. The next run will use the new base." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git add --all
          git commit -m 'chore: apply verified automated maintenance' -m "Verified run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Published the exact tested candidate to main with a normal fast-forward push. No force push or protection bypass." >> "$GITHUB_STEP_SUMMARY"
  confirm:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Explicitly dispatch Check after the bot push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run check.yml --ref main
      - name: Refresh static security analysis after the bot push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run security.yml --ref main
